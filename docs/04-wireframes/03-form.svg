<text id="building-location-label-32" x="312" y="321" font-size="12" font-weight="700" text-anchor="start" font-style="normal">Building / Location *</text>
<text id="database-column-label-33" x="312" y="336" font-size="9" font-weight="400" text-anchor="start" font-style="italic">facility_issues.location_id · locations.building_name</text>
