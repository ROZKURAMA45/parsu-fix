<text id="specific-area-placeholder-45" x="324" y="470" font-size="12" font-weight="400" text-anchor="start" font-style="normal">e.g., north entrance / second-floor landing</text>
<text id="issue-category-label-46" x="860" y="420" font-size="12" font-weight="700" text-anchor="start" font-style="normal">Issue Category *</text>
<text id="database-column-label-47" x="860" y="435" font-size="9" font-weight="400" text-anchor="start" font-style="italic">facility_issues.issue_category</text>
<rect id="issue-category-dropdown-48" x="860" y="444" width="504" height="42" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text id="issue-category-placeholder-49" x="872" y="470" font-size="12" font-weight="400" text-anchor="start" font-style="normal">Choose a category  v</text>
<text id="description-label-50" x="312" y="519" font-size="12" font-weight="700" text-anchor="start" font-style="normal">Description *</text>
<text id="database-column-label-51" x="312" y="534" font-size="9" font-weight="400" text-anchor="start" font-style="italic">facility_issues.description</text>
<rect id="description-input-52" x="312" y="543" width="1052" height="104" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
