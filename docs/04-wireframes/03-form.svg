<rect id="room-dropdown-40" x="1119" y="345" width="245" height="42" rx="0" fill="#fff" stroke="#000" stroke-width="1"/>
<text id="room-placeholder-41" x="1131" y="371" font-size="12" font-weight="400" text-anchor="start" font-style="normal">Room  v</text>
<text id="specific-area-label-42" x="312" y="420" font-size="12" font-weight="700" text-anchor="start" font-style="normal">Specific Area (optional)</text>
<text id="database-column-label-43" x="312" y="435" font-size="9" font-weight="400" text-anchor="start" font-style="italic">facility_issues.specific_area</text>
